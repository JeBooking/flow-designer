name: Verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # 参考文件打开器的验证使用 Windows API；执行脚本只操作模拟工程。
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m venv backend/.local/venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          backend/.local/venv/Scripts/python.exe -m pip install -r backend/requirements-flowable.txt
      - name: Build runtime
        run: mvn -B -ntp -f flowable-runtime/pom.xml -DskipTests package
      - name: Stamp prebuilt runtime
        run: node scripts/runtime-manifest.mjs
      - name: Check frontend
        run: |
          pnpm type-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm build-only
      - name: Verify workflows and runtime
        run: pnpm verify
      - name: Upload prebuilt runtime
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-flowable-runtime
          path: |
            flowable-runtime/target/diagnostic-flowable-1.0.0.jar
            flowable-runtime/target/diagnostic-flowable-1.0.0.jar.manifest.json
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-logs
          path: backend/.local/verification/
          if-no-files-found: ignore
