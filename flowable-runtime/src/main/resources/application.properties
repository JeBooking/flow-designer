server.address=127.0.0.1
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/diagnosis;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.security.user.name=${FLOWABLE_USER:diagnostic}
spring.security.user.password=${FLOWABLE_PASSWORD:local-demo}
flowable.database-schema-update=true
flowable.history-level=full
flowable.rest.app.authentication-mode=any-user
flowable.process.servlet.path=/process-api
flowable.external-job.servlet.path=/external-job-api
logging.level.root=WARN
